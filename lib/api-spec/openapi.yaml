openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: Campaign Governance API
servers:
  - url: /api
tags:
  - name: health
  - name: Auth
  - name: foundation
  - name: taxonomy
  - name: campaigns
  - name: finance
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200": { description: Healthy, content: { application/json: { schema: { $ref: "#/components/schemas/HealthStatus" } } } }
        "503": { description: Degraded, content: { application/json: { schema: { $ref: "#/components/schemas/HealthStatus" } } } }
  /auth/user:
    get:
      operationId: getCurrentAuthUser
      tags: [Auth]
      responses:
        "200": { description: Current auth state, content: { application/json: { schema: { $ref: "#/components/schemas/AuthUserEnvelope" } } } }
  /login:
    get:
      operationId: beginBrowserLogin
      tags: [Auth]
      parameters:
        - { name: returnTo, in: query, schema: { type: string } }
      responses:
        "302": { description: OIDC redirect }
  /callback:
    get:
      operationId: handleBrowserLoginCallback
      tags: [Auth]
      responses:
        "302": { description: Login callback redirect }
  /logout:
    get:
      operationId: logoutBrowserSession
      tags: [Auth]
      parameters:
        - { name: returnTo, in: query, schema: { type: string, default: / } }
      responses:
        "302": { description: Logout redirect }
  /mobile-auth/token-exchange:
    post:
      operationId: exchangeMobileAuthorizationCode
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MobileTokenExchangeRequest" }
      responses:
        "200": { description: Session created, content: { application/json: { schema: { $ref: "#/components/schemas/MobileTokenExchangeSuccess" } } } }
        "400": { description: Invalid request, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "500": { description: Exchange failed, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  /mobile-auth/logout:
    post:
      operationId: logoutMobileSession
      tags: [Auth]
      responses:
        "200": { description: Logged out, content: { application/json: { schema: { $ref: "#/components/schemas/LogoutSuccess" } } } }
  /foundation/summary:
    get:
      operationId: getFoundationSummary
      tags: [foundation]
      responses:
        "200": { description: Summary, content: { application/json: { schema: { $ref: "#/components/schemas/FoundationSummary" } } } }
  /foundation/taxonomies:
    get:
      operationId: listTaxonomyValues
      tags: [foundation]
      parameters:
        - { name: type, in: query, schema: { $ref: "#/components/schemas/LegacyTaxonomyType" } }
      responses:
        "200": { description: Legacy values, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/LegacyTaxonomyValue" } } } } }
  /foundation/activity:
    get:
      operationId: listFoundationActivity
      tags: [foundation]
      responses:
        "200": { description: Activity, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/FoundationActivity" } } } } }
  /taxonomy/access:
    get:
      operationId: getTaxonomyAccess
      tags: [taxonomy]
      responses:
        "200": { description: Effective permissions, content: { application/json: { schema: { $ref: "#/components/schemas/TaxonomyAccess" } } } }
        "401": { description: Unauthorized }
  /taxonomy/categories:
    get:
      operationId: listTaxonomyCategories
      tags: [taxonomy]
      responses:
        "200": { description: Categories, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/TaxonomyCategory" } } } } }
  /taxonomy/values:
    get:
      operationId: listGovernedValues
      tags: [taxonomy]
      parameters:
        - { name: category, in: query, schema: { $ref: "#/components/schemas/TaxonomyCategoryKey" } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/GovernanceStatus" } }
        - { name: search, in: query, schema: { type: string } }
        - { name: parentId, in: query, schema: { type: string } }
      responses:
        "200": { description: Governed values, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/GovernedValue" } } } } }
    post:
      operationId: createGovernedValue
      tags: [taxonomy]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GovernedValueInput" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/GovernedValue" } } } }
        "400": { description: Invalid }
        "401": { description: Unauthorized }
        "403": { description: Forbidden }
        "409": { description: Conflict }
  /taxonomy/values/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getGovernedValue
      tags: [taxonomy]
      responses:
        "200": { description: Detail, content: { application/json: { schema: { $ref: "#/components/schemas/GovernedValueDetail" } } } }
        "404": { description: Not found }
    patch:
      operationId: updateGovernedValue
      tags: [taxonomy]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GovernedValueUpdate" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/GovernedValue" } } } }
        "403": { description: Forbidden }
        "409": { description: Conflict }
    delete:
      operationId: deleteGovernedValue
      tags: [taxonomy]
      responses:
        "204": { description: Deleted }
        "403": { description: Forbidden }
        "409": { description: Referenced or not draft }
  /taxonomy/values/{id}/transition:
    post:
      operationId: transitionGovernedValue
      tags: [taxonomy]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GovernanceTransitionInput" }
      responses:
        "200": { description: Transitioned, content: { application/json: { schema: { $ref: "#/components/schemas/GovernedValue" } } } }
        "400": { description: Illegal transition }
        "403": { description: Forbidden }
  /taxonomy/values/{id}/history:
    get:
      operationId: listGovernedValueHistory
      tags: [taxonomy]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: History, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/TaxonomyAuditEvent" } } } } }
  /taxonomy/associations:
    post:
      operationId: createTaxonomyAssociation
      tags: [taxonomy]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaxonomyAssociationInput" }
      responses:
        "201": { description: Associated, content: { application/json: { schema: { $ref: "#/components/schemas/TaxonomyAssociation" } } } }
        "403": { description: Forbidden }
        "409": { description: Duplicate }
  /taxonomy/review-requests:
    get:
      operationId: listTaxonomyReviewRequests
      tags: [taxonomy]
      responses:
        "200": { description: Requests, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/TaxonomyReviewRequest" } } } } }
    post:
      operationId: createTaxonomyReviewRequest
      tags: [taxonomy]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaxonomyReviewRequestInput" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/TaxonomyReviewRequest" } } } }
  /taxonomy/imports:
    get:
      operationId: listTaxonomyImports
      tags: [taxonomy]
      responses:
        "200": { description: Imports, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/TaxonomyImportBatch" } } } } }
  /taxonomy/imports/preview:
    post:
      operationId: createTaxonomyImportPreview
      tags: [taxonomy]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaxonomyImportPreviewInput" }
      responses:
        "201": { description: Preview created, content: { application/json: { schema: { $ref: "#/components/schemas/TaxonomyImportBatch" } } } }
        "403": { description: Forbidden }
  /taxonomy/imports/{id}/conflicts:
    get:
      operationId: listTaxonomyImportConflicts
      tags: [taxonomy]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Conflicts, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/TaxonomyImportConflict" } } } } }
  /taxonomy/conflicts/{id}/resolve:
    post:
      operationId: resolveTaxonomyImportConflict
      tags: [taxonomy]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConflictResolutionInput" }
      responses:
        "200": { description: Resolved, content: { application/json: { schema: { $ref: "#/components/schemas/TaxonomyImportConflict" } } } }
        "403": { description: Forbidden }
  /campaigns:
    get:
      operationId: listCampaigns
      tags: [campaigns]
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
      responses:
        "200": { description: Registry results, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Campaign" } } } } }
    post:
      operationId: createCampaign
      tags: [campaigns]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CampaignInput" } } } }
      responses:
        "201": { description: Draft created, content: { application/json: { schema: { $ref: "#/components/schemas/Campaign" } } } }
        "400": { description: Invalid, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  /campaigns/{campaignKey}:
    parameters:
      - { name: campaignKey, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getCampaign
      tags: [campaigns]
      responses:
        "200": { description: Campaign detail, content: { application/json: { schema: { $ref: "#/components/schemas/CampaignDetail" } } } }
        "404": { description: Not found }
    patch:
      operationId: updateCampaign
      tags: [campaigns]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CampaignUpdate" } } } }
      responses:
        "200": { description: Draft updated, content: { application/json: { schema: { $ref: "#/components/schemas/Campaign" } } } }
        "409": { description: Stale or submitted }
    delete:
      operationId: archiveCampaign
      tags: [campaigns]
      responses:
        "204": { description: Draft archived }
        "409": { description: Non-draft campaigns are retained }
  /campaigns/{campaignKey}/readiness:
    get:
      operationId: getCampaignReadiness
      tags: [campaigns]
      parameters:
        - { name: campaignKey, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Readiness, content: { application/json: { schema: { $ref: "#/components/schemas/CampaignReadiness" } } } }
  /campaigns/{campaignKey}/submit:
    post:
      operationId: submitCampaign
      tags: [campaigns]
      parameters:
        - { name: campaignKey, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CampaignSubmissionInput" } } } }
      responses:
        "200": { description: Submitted, content: { application/json: { schema: { $ref: "#/components/schemas/Campaign" } } } }
        "409": { description: Not ready, content: { application/json: { schema: { $ref: "#/components/schemas/CampaignReadiness" } } } }
  /campaigns/{campaignKey}/audiences:
    put:
      operationId: replaceCampaignAudiences
      tags: [campaigns]
      parameters:
        - { name: campaignKey, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AudiencePlanInput" } } } }
      responses:
        "200": { description: Audience plan, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AudienceSelection" } } } } }
        "400": { description: Invalid }
  /campaigns/{campaignKey}/products:
    put:
      operationId: replaceCampaignProducts
      tags: [campaigns]
      parameters:
        - { name: campaignKey, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProductPlanInput" } } } }
      responses:
        "200": { description: Product plan, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ProductAssociation" } } } } }
        "400": { description: Invalid }
  /campaigns/{campaignKey}/activities:
    post:
      operationId: createCampaignActivity
      tags: [campaigns]
      parameters:
        - { name: campaignKey, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CampaignActivityInput" } } } }
      responses:
        "201": { description: Activity created, content: { application/json: { schema: { $ref: "#/components/schemas/CampaignActivity" } } } }
        "400": { description: "Invalid dates, products, or money" }
  /activities/{activityId}:
    patch:
      operationId: updateCampaignActivity
      tags: [campaigns]
      parameters:
        - { name: activityId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CampaignActivityUpdate" } } } }
      responses:
        "200": { description: Activity updated, content: { application/json: { schema: { $ref: "#/components/schemas/CampaignActivity" } } } }
        "423": { description: Activity has allocations in a closed period }
  /campaigns/{campaignKey}/costs:
    post:
      operationId: createCampaignCost
      tags: [finance]
      parameters:
        - { name: campaignKey, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CampaignCostInput" } } } }
      responses:
        "201": { description: Authoritative cost created, content: { application/json: { schema: { $ref: "#/components/schemas/CampaignCost" } } } }
  /costs/{costId}:
    patch:
      operationId: updateCampaignCost
      tags: [finance]
      parameters:
        - { name: costId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CampaignCostUpdate" } } } }
      responses:
        "200": { description: Authoritative cost updated, content: { application/json: { schema: { $ref: "#/components/schemas/CampaignCost" } } } }
        "423": { description: Campaign has a closed planning period }
  /costs/{costId}/dimensions:
    put:
      operationId: replaceCampaignCostDimensions
      tags: [finance]
      parameters:
        - { name: costId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CostDimensionPlanInput" } } } }
      responses:
        "200": { description: Exactly reconciled reporting allocations, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CostDimensionAllocation" } } } } }
        "400": { description: Each represented dimension must total exactly 100 percent }
  /fiscal-calendars:
    get:
      operationId: listFiscalCalendars
      tags: [finance]
      responses:
        "200": { description: Calendars, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/FiscalCalendar" } } } } }
    post:
      operationId: createFiscalCalendar
      tags: [finance]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FiscalCalendarInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/FiscalCalendar" } } } }
  /fiscal-calendars/{calendarId}/snapshots:
    post:
      operationId: publishFiscalCalendarSnapshot
      tags: [finance]
      parameters:
        - { name: calendarId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FiscalCalendarSnapshotInput" } } } }
      responses:
        "201": { description: Immutable snapshot published, content: { application/json: { schema: { $ref: "#/components/schemas/FiscalCalendarSnapshot" } } } }
        "400": { description: Invalid or overlapping periods }
  /fiscal-calendars/{calendarId}/active-snapshot:
    get:
      operationId: getActiveFiscalCalendarSnapshot
      tags: [finance]
      parameters:
        - { name: calendarId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "Immutable active fiscal snapshot and explicit boundaries", content: { application/json: { schema: { $ref: "#/components/schemas/FiscalCalendarSnapshot" } } } }
        "404": { description: Calendar or active snapshot not found }
  /campaigns/{campaignKey}/budget:
    put:
      operationId: setCampaignBudget
      tags: [finance]
      parameters:
        - { name: campaignKey, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CampaignBudgetInput" } } } }
      responses:
        "200": { description: Budget, content: { application/json: { schema: { $ref: "#/components/schemas/CampaignBudget" } } } }
  /campaigns/{campaignKey}/planning-periods/generate:
    post:
      operationId: generateCampaignPlanningPeriods
      tags: [finance]
      parameters:
        - { name: campaignKey, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PlanningPeriodGenerationInput" } } } }
      responses:
        "200": { description: Generated and exactly reconciled, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CampaignPlanningPeriod" } } } } }
        "409": { description: "Missing dates, calendar gaps, or closed values" }
  /planning-periods/{planningPeriodId}:
    patch:
      operationId: updateCampaignPlanningPeriod
      tags: [finance]
      parameters:
        - { name: planningPeriodId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PlanningPeriodUpdate" } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/CampaignPlanningPeriod" } } } }
        "423": { description: Period locked }
  /planning-periods/{planningPeriodId}/close:
    post:
      operationId: closeCampaignPlanningPeriod
      tags: [finance]
      parameters:
        - { name: planningPeriodId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PeriodCloseInput" } } } }
      responses:
        "200": { description: Closed, content: { application/json: { schema: { $ref: "#/components/schemas/CampaignPlanningPeriod" } } } }
  /planning-periods/{planningPeriodId}/reopen:
    post:
      operationId: reopenCampaignPlanningPeriod
      tags: [finance]
      parameters:
        - { name: planningPeriodId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PeriodReopenInput" } } } }
      responses:
        "200": { description: Reopened with approval, content: { application/json: { schema: { $ref: "#/components/schemas/CampaignPlanningPeriod" } } } }
  /activities/{activityId}/period-allocations:
    put:
      operationId: allocateActivityAcrossPeriods
      tags: [finance]
      parameters:
        - { name: activityId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ActivityAllocationInput" } } } }
      responses:
        "200": { description: Exact allocation, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ActivityPeriodAllocation" } } } } }
        "423": { description: Affected period is locked }
components:
  schemas:
    HealthStatus:
      type: object
      required: [status, application, database, checkedAt]
      properties:
        status: { type: string, enum: [ok, degraded] }
        application: { type: string, enum: [reachable] }
        database: { type: string, enum: [reachable, unreachable] }
        checkedAt: { type: string, format: date-time }
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id: { type: string }
        email: { type: [string, "null"] }
        firstName: { type: [string, "null"] }
        lastName: { type: [string, "null"] }
        profileImageUrl: { type: [string, "null"] }
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - { $ref: "#/components/schemas/AuthUser" }
            - { type: "null" }
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code: { type: string, minLength: 1 }
        code_verifier: { type: string, minLength: 1 }
        redirect_uri: { type: string, minLength: 1 }
        state: { type: string, minLength: 1 }
        nonce: { type: string }
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties: { token: { type: string } }
    LogoutSuccess:
      type: object
      required: [success]
      properties: { success: { type: boolean } }
    ErrorEnvelope:
      type: object
      required: [error]
      properties: { error: { type: string } }
    TaxonomyCategoryKey:
      type: string
      enum: [strategic_program, segment, subsegment, account_size_tier, buying_group_function, persona, seniority_level, messaging_cohort, product, product_family, capability_solution, customer_need, campaign_type, business_objective, commercial_motion, marketing_objective, primary_conversion, journey_stage, region, subregion, country, market_cluster, language, channel, source, delivery_mechanism, platform, activity_type, creative_format, call_to_action, campaign_member_status_template, fiscal_calendar, fiscal_year, fiscal_quarter, fiscal_period, currency, cost_center]
    GovernanceStatus:
      type: string
      enum: [draft, in_review, approved, active, inactive, superseded]
    TaxonomyCategory:
      type: object
      required: [key, displayName, supportsParent, supportsMeasurementRule]
      properties:
        key: { $ref: "#/components/schemas/TaxonomyCategoryKey" }
        displayName: { type: string }
        supportsParent: { type: boolean }
        supportsMeasurementRule: { type: boolean }
    GovernedValue:
      type: object
      required: [id, stableKey, category, displayName, definition, status, effectiveStart, taxonomyVersion, source, owner, legacyCodes, usageCount, rowVersion, createdAt, updatedAt]
      properties:
        id: { type: string }
        stableKey: { type: string }
        category: { $ref: "#/components/schemas/TaxonomyCategoryKey" }
        displayName: { type: string }
        definition: { type: string }
        status: { $ref: "#/components/schemas/GovernanceStatus" }
        effectiveStart: { type: string }
        effectiveEnd: { type: [string, "null"] }
        taxonomyVersion: { type: string }
        source: { type: string }
        owner: { type: string }
        parentId: { type: [string, "null"] }
        supersededById: { type: [string, "null"] }
        legacyCodes: { type: array, items: { type: string } }
        measurementRule: { type: [string, "null"] }
        usageCount: { type: number }
        rowVersion: { type: number }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    GovernedValueDetail:
      allOf:
        - { $ref: "#/components/schemas/GovernedValue" }
        - type: object
          required: [associations, history]
          properties:
            associations: { type: array, items: { $ref: "#/components/schemas/TaxonomyAssociation" } }
            history: { type: array, items: { $ref: "#/components/schemas/TaxonomyAuditEvent" } }
